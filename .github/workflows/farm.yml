# Load-test farm. Each job (model x users x rep from farm/matrix.json) runs on its own runner and runs
# every variant back to back there (farm/job.sh -> farm/run.sh), so variants are compared on the same hardware.
name: farm
on:
  push:
    branches: [bench-farm]
    paths: ['farm/**', '.github/workflows/farm.yml']
  workflow_dispatch:
permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      cells: ${{ steps.p.outputs.cells }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          cells=$(jq -c '.defaults as $d | [.models[] | . as $m | ($m.users // $d.users)[] as $u | ($m.reps // $d.reps)[] as $r
            | {model: $m.name, cpumax: ($m.cpumax // "max"), burn: ($m.burn // ""), mem: ($m.mem // $d.mem), os: ($m.os // $d.os),
               users: $u, rep: $r, ramp: $d.ramp, hold: $d.hold, down: $d.down}]' farm/matrix.json)
          echo "cells=$cells" >> "$GITHUB_OUTPUT"
          echo "$cells" | jq -r '.[] | "\(.model) \(.users) rep\(.rep) \(.os)"'

  run:
    needs: plan
    runs-on: ${{ matrix.cell.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJson(needs.plan.outputs.cells) }}
    name: ${{ matrix.cell.model }} ${{ matrix.cell.users }} r${{ matrix.cell.rep }}
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3 jq >/dev/null
      - name: build and run every variant
        run: bash farm/job.sh '${{ toJson(matrix.cell) }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: farm-${{ matrix.cell.model }}-${{ matrix.cell.users }}-r${{ matrix.cell.rep }}
          path: out/
          retention-days: 14
