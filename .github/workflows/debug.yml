name: debug
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: environment
        run: |
          uname -a; nproc; free -m; ulimit -a; cat /proc/sys/net/core/somaxconn; cat /sys/kernel/mm/transparent_hugepage/enabled
      - name: tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3 jq curl openssl
      - name: seed
        run: bash seed/make-seed.sh
      - name: install.sh
        run: sudo bash submissions/c-iouring-jowinjestine/install.sh
      - name: build (PGO, bounded)
        run: |
          cd submissions/c-iouring-jowinjestine
          timeout 900 bash -x build.sh > /tmp/build.log 2>&1 || echo "build rc=$?"
          tail -60 /tmp/build.log
      - name: start and test (bounded)
        run: |
          export JWT_SECRET=twelve-dollar-challenge HOST=127.0.0.1 PORT=3000 SQLITE_PATH=/tmp/feed.db
          cp seed/feed.db /tmp/feed.db
          bash submissions/c-iouring-jowinjestine/start.sh > /tmp/server.log 2>&1 &
          PID=$!
          for i in $(seq 60); do curl -sf -m 2 http://127.0.0.1:3000/health && break; sleep 1; done; echo
          timeout 180 bash test/test.sh http://127.0.0.1:3000 || echo "test rc=$?"
          echo "--- server log"; cat /tmp/server.log
          echo "--- threads"; for t in /proc/$PID/task/*; do echo "$t: $(cat $t/comm) wchan=$(cat $t/wchan 2>/dev/null)"; sudo cat $t/stack 2>/dev/null; done
          echo "--- sockets"; ss -tanp | head -30
          kill -TERM $PID; sleep 2; tail -5 /tmp/server.log
