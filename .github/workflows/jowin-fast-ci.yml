name: jowin io_uring fast correctness
on:
  pull_request:
    branches:
      - experiment/jowin-400k-base
    paths:
      - submissions/c-iouring-jowinjestine/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install challenge tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sqlite3 jq curl openssl
      - name: Prepare seed
        run: bash seed/make-seed.sh
      - name: Install submission dependencies
        run: sudo bash submissions/c-iouring-jowinjestine/install.sh
      - name: Build and run the official correctness checks (plain optimized binary)
        env:
          PGO: "0"
        run: bash test/run.sh submissions/c-iouring-jowinjestine
